name: Deploy to GitHub Pages

on:
  push:
    branches: [main, test-kimi]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Serialize the entire snapshot → verification → deployment, across both publishing branches.
  # PR checks retain their own cancellable group. An artifact cannot wait behind a newer deployment.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # types, unit tests and the production build: nothing deploys unless all three pass
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx biome ci .
      # (the shaders through the browser's own WebGPU compiler: SwiftShader on the runner)
      - run: bun scripts/check-wgsl.ts
      - run: bun test --reporter=junit --reporter-outfile=junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml
      - run: bun run build:pages

  # the site assembled for deployment: main at the root, test-kimi under /test/ — one artifact,
  # one deployment (a Pages deployment replaces the whole site, so a main-only build would wipe
  # /test/ and a branch-only build would wipe /). The app is base-path-agnostic: every URL in the
  # bundle, the shell, the manifest and the Service Worker's registration is relative, and the
  # /test/sw.js scope (/test/) wins over the root worker's (/) for the pages under it.
  site:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-kimi')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - name: Snapshot both branch revisions
        id: revisions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          resolve_ref() {
            local branch="$1" response status sha
            response=$(mktemp)
            status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/$REPOSITORY/git/ref/heads/$branch") || { rm -f "$response"; return 1; }
            if [ "$status" = 200 ]; then
              sha=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' "$response") || { rm -f "$response"; return 1; }
              echo "$sha"
            elif [ "$status" = 404 ] && [ "$branch" = test-kimi ]; then
              echo absent
            else
              echo "Cannot resolve $branch: HTTP $status" >&2
              rm -f "$response"
              return 1
            fi
            rm -f "$response"
          }
          main_sha=$(resolve_ref main)
          test_sha=$(resolve_ref test-kimi)
          echo "main=$main_sha" >> "$GITHUB_OUTPUT"
          echo "test=$test_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revisions.outputs.main }}
          path: main-src
      - uses: actions/checkout@v4
        if: steps.revisions.outputs.test != 'absent'
        with:
          ref: ${{ steps.revisions.outputs.test }}
          path: test-src
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('main-src/bun.lock') }}
      - name: Verify and build the exact main revision → the root
        working-directory: main-src
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bunx biome ci .
          bun scripts/check-wgsl.ts
          bun test
          bun run build:pages
      - name: Verify and build the exact test-kimi revision → /test/
        if: steps.revisions.outputs.test != 'absent'
        working-directory: test-src
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bunx biome ci .
          bun scripts/check-wgsl.ts
          bun test
          bun run build:pages
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -a main-src/_site/. _site/
          if [ -d test-src/_site ]; then
            mkdir -p _site/test
            cp -a test-src/_site/. _site/test/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # (the github-pages environment's branch policy must name the branch, or this job is rejected
  # before its first step: Settings → Environments → github-pages → deployment branches — main and
  # test-kimi are both registered; after the branch is merged and deleted, its entry is inert)
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-kimi')
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: The two addresses
        run: |
          echo "main:      ${{ steps.deployment.outputs.page_url }}"
          echo "test-kimi: ${{ steps.deployment.outputs.page_url }}test/"
