name: Deploy to GitHub Pages

# The site: main at the root, test-kimi under /test/, and Ineptie-Version under /ineptie/ (an A/B of each
# branch against production on the same origin). The app is base-path-agnostic; each build's Service
# Worker keeps to its own scope's caches and pages, and the preview's storage keys carry its path
# (scripts/build-pages.ts: KERR_SUBPATH) — the two never touch each other's offline shell or saves.
#
# Every publishing branch carries this workflow so each deployment preserves all previews.
#
# The three revisions are verified side by side, their unit tests' files in parallel (a worker a core); a main
# revision already verified and built is not verified again (its build kept by its commit).

on:
  push:
    # (GitHub reads these before any env: the preview branch is named here too — keep it equal to
    # env.PREVIEW_BRANCH; to retire the preview, remove it here and empty PREVIEW_BRANCH)
    branches: [main, test-kimi, Ineptie-Version]
  pull_request:
  workflow_dispatch:

env:
  # the preview: its branch (empty, or a branch that does not exist: none — everything below inert)
  # and the site's directory it is served from
  PREVIEW_BRANCH: test-kimi
  PREVIEW_PATH: test
  INEPTIE_BRANCH: Ineptie-Version
  INEPTIE_PATH: ineptie

# (each job asks for what it needs: no write token where branch code runs)
permissions: {}

concurrency:
  # Serialize the entire snapshot → verification → deployment, across all publishing branches.
  # PR checks retain their own cancellable group. An artifact cannot wait behind a newer deployment.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # a pull request: types, lint, shaders, unit tests and the production build
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # (the merge and its base: the binaries the pull request adds, checked below)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      # (the Git LFS objects — docs/ASSETS.md —: cached by their ids, fetched only when they change)
      - run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx biome ci .
      # (the binaries' budgets — docs/ASSETS.md)
      - run: bun scripts/check-repo-size.ts --base HEAD^1
      # (the shaders through the browser's own WebGPU compiler: SwiftShader on the runner; the forests' tracer
      # against its TypeScript twin — both exit 0 without an adapter)
      - run: bun scripts/check-wgsl.ts
      - run: bun scripts/check-forest.ts --rays 2000
      - run: bun test --parallel --timeout 30000 --reporter=junit --reporter-outfile=junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml
      - run: bun run build:pages

  # a push (or a manual run): the site assembled from both branches' heads, each verified exactly as
  # built — one artifact, one deployment (a Pages deployment replaces the whole site). main gates the
  # deployment; a failing preview is reported and left out, the site deploying with main alone. The two
  # revisions are verified side by side (main, preview), their builds assembled after (site).
  snapshot:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      main: ${{ steps.revisions.outputs.main }}
      test: ${{ steps.revisions.outputs.test }}
      ineptie: ${{ steps.revisions.outputs.ineptie }}
    steps:
      - name: Snapshot all branch revisions
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # (a branch's head; "absent" for a missing preview branch — or none named)
          resolve_ref() {
            local branch="$1" response status sha
            if [ -z "$branch" ]; then echo absent; return; fi
            response=$(mktemp)
            status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/$REPOSITORY/git/ref/heads/$branch") || { rm -f "$response"; return 1; }
            if [ "$status" = 200 ]; then
              sha=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' "$response") || { rm -f "$response"; return 1; }
              echo "$sha"
            elif [ "$status" = 404 ] && { [ "$branch" = "$PREVIEW_BRANCH" ] || [ "$branch" = "$INEPTIE_BRANCH" ]; }; then
              echo absent
            else
              echo "Cannot resolve $branch: HTTP $status" >&2
              rm -f "$response"
              return 1
            fi
            rm -f "$response"
          }
          main_sha=$(resolve_ref main)
          test_sha=$(resolve_ref "$PREVIEW_BRANCH")
          ineptie_sha=$(resolve_ref "$INEPTIE_BRANCH")
          echo "main=$main_sha" >> "$GITHUB_OUTPUT"
          echo "test=$test_sha" >> "$GITHUB_OUTPUT"
          echo "ineptie=$ineptie_sha" >> "$GITHUB_OUTPUT"

  # the exact main revision verified and built → the root. A revision verified and built before — a preview
  # push, main unchanged — is not verified again: its build is kept by its commit (saved only once verified).
  main:
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: built
        uses: actions/cache/restore@v4
        with:
          path: site-main.tar
          key: site-main-${{ needs.snapshot.outputs.main }}
      # (with its parent: the binaries its last commit adds, checked below)
      - if: steps.built.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.snapshot.outputs.main }}
          fetch-depth: 2
          persist-credentials: false
      # (the Git LFS objects — docs/ASSETS.md —: cached by their ids, fetched only when they change)
      - if: steps.built.outputs.cache-hit != 'true'
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids
      - if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - if: steps.built.outputs.cache-hit != 'true'
        run: git lfs pull
      - if: steps.built.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Verify and build the exact main revision
        if: steps.built.outputs.cache-hit != 'true'
        # (the size and forest checks where the revision has them: a branch from before them builds without;
        # the unit tests' files in parallel, a worker a core — a test's own budget 30 s, not bun's 5: the long
        # flights' of 4–5 s alone took 6–10 s with the cores shared)
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bunx biome ci .
          if [ -f scripts/check-repo-size.ts ]; then bun scripts/check-repo-size.ts --base HEAD^1; fi
          bun scripts/check-wgsl.ts
          if [ -f scripts/check-forest.ts ]; then bun scripts/check-forest.ts --rays 2000; fi
          bun test --parallel --timeout 30000 --reporter=junit --reporter-outfile=junit.xml
          bun run build:pages
          tar -cf site-main.tar -C _site .
      - if: always() && steps.built.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml
          if-no-files-found: ignore
      - if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: site-main.tar
          key: site-main-${{ needs.snapshot.outputs.main }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-main
          path: site-main.tar
          compression-level: 0
          retention-days: 1

  # the exact preview revision verified and built → /<PREVIEW_PATH>/ (its failure does not stop production:
  # reported below, the preview left out)
  preview:
    needs: snapshot
    if: needs.snapshot.outputs.test != 'absent'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.verify.outcome == 'success' && 'yes' || '' }}
    steps:
      # (a preview that cannot be checked out fails its verification: reported, left out)
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ needs.snapshot.outputs.test }}
          fetch-depth: 2
          persist-credentials: false
      - if: steps.checkout.outcome == 'success'
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids
      - if: steps.checkout.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - if: steps.checkout.outcome == 'success'
        run: git lfs pull || echo "::warning::the preview's LFS objects could not be fetched"
      - uses: oven-sh/setup-bun@v2
      - if: steps.checkout.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Verify and build the exact preview revision
        id: verify
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          KERR_SUBPATH: ${{ env.PREVIEW_PATH }}
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bunx biome ci .
          if [ -f scripts/check-repo-size.ts ]; then bun scripts/check-repo-size.ts --base HEAD^1; fi
          bun scripts/check-wgsl.ts
          if [ -f scripts/check-forest.ts ]; then bun scripts/check-forest.ts --rays 2000; fi
          bun test --parallel --timeout 30000 --reporter=junit --reporter-outfile=junit.xml
          bun run build:pages
          tar -cf site-test.tar -C _site .
      - if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: junit-preview
          path: junit.xml
          if-no-files-found: ignore
      - if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: site-test
          path: site-test.tar
          compression-level: 0
          retention-days: 1
      - name: Report a failed preview
        if: steps.verify.outcome != 'success'
        run: |
          msg="$PREVIEW_BRANCH (${{ needs.snapshot.outputs.test }}) failed its verification: the site deploys with main alone, /$PREVIEW_PATH/ removed"
          echo "::warning title=Preview not deployed::$msg"
          echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
          echo "> $msg" >> "$GITHUB_STEP_SUMMARY"

  # The additional preview, isolated under /ineptie/.
  ineptie:
    needs: snapshot
    if: needs.snapshot.outputs.ineptie != 'absent'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.verify.outcome == 'success' && 'yes' || '' }}
    steps:
      # (a preview that cannot be checked out fails its verification: reported, left out)
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ needs.snapshot.outputs.ineptie }}
          fetch-depth: 2
          persist-credentials: false
      - if: steps.checkout.outcome == 'success'
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids
      - if: steps.checkout.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - if: steps.checkout.outcome == 'success'
        run: git lfs pull || echo "::warning::the preview's LFS objects could not be fetched"
      - uses: oven-sh/setup-bun@v2
      - if: steps.checkout.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Verify and build the exact Ineptie-Version revision
        id: verify
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          KERR_SUBPATH: ${{ env.INEPTIE_PATH }}
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bunx biome ci .
          if [ -f scripts/check-repo-size.ts ]; then bun scripts/check-repo-size.ts --base HEAD^1; fi
          bun scripts/check-wgsl.ts
          if [ -f scripts/check-forest.ts ]; then bun scripts/check-forest.ts --rays 2000; fi
          bun test --parallel --timeout 30000 --reporter=junit --reporter-outfile=junit.xml
          bun run build:pages
          tar -cf site-ineptie.tar -C _site .
      - if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: junit-ineptie
          path: junit.xml
          if-no-files-found: ignore
      - if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: site-ineptie
          path: site-ineptie.tar
          compression-level: 0
          retention-days: 1
      - name: Report a failed preview
        if: steps.verify.outcome != 'success'
        run: |
          msg="$INEPTIE_BRANCH (${{ needs.snapshot.outputs.ineptie }}) failed its verification: deployment is stopped to preserve the published site"
          echo "::warning title=Preview not deployed::$msg"
          echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
          echo "> $msg" >> "$GITHUB_STEP_SUMMARY"

  # The builds assembled: main at the root, both previews beside it.
  site:
    needs: [snapshot, main, preview, ineptie]
    if: always() && needs.main.result == 'success' && (needs.snapshot.outputs.ineptie == 'absent' || needs.ineptie.outputs.ok == 'yes')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      preview: ${{ steps.assemble.outputs.preview == 'yes' && env.PREVIEW_PATH || '' }}
      ineptie: ${{ steps.assemble.outputs.ineptie == 'yes' && env.INEPTIE_PATH || '' }}
      main: ${{ needs.snapshot.outputs.main }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-main
      - if: needs.preview.outputs.ok == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: site-test
      - if: needs.ineptie.outputs.ok == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: site-ineptie
      # (each app's URLs are relative to its own directory — its bundle, its workers, its Service Worker's
      # precache and scope —, and Pages serves no links: the two builds are two copies, against Pages' 1 GB.
      # So the preview's hashed binaries that main has byte for byte — the textures, the meshes, the maps:
      # most of a build, none of them precached — are left to main's copy, the preview's code pointing at it
      # ("./x" → "../x"); one still named any other way is kept. Past 800 MB a warning, past 900 MB the
      # preview left out, and main alone past 900 MB fails before deploying; docs/ASSETS.md)
      - name: Assemble the site
        id: assemble
        run: |
          set -euo pipefail
          mkdir -p _site
          tar -xf site-main.tar -C _site
          preview=no
          ineptie=no
          for kind in test ineptie; do
            if [ "$kind" = test ]; then preview_path="$PREVIEW_PATH"; else preview_path="$INEPTIE_PATH"; fi
            if [ ! -f "site-$kind.tar" ]; then continue; fi
            P="_site/$preview_path"
            mkdir -p "$P"
            tar -xf "site-$kind.tar" -C "$P"
            # (main's byte-identical copies of the preview's hashed binaries)
            : > shared.txt
            for f in "$P"/*; do
              n=${f##*/}
              if [ -f "$f" ] && [[ "$n" =~ -[a-z0-9]{8}\.[a-z0-9]+$ ]] && ! [[ "$n" =~ \.(js|css|html|json|wasm|map)$ ]] \
                && cmp -s "$f" "_site/$n"; then echo "$n" >> shared.txt; fi
            done
            # (the preview's code: "./x" → "../x" for those)
            cat > relink.pl <<'PERL'
          BEGIN { open my $h, "<", "shared.txt" or die; my @n = map { chomp; quotemeta } <$h>; $re = join "|", @n; }
          s{(?<=[\x22\x27\x60(=,\s])\./($re)(?=[\x22\x27\x60)\s?#,])}{../$1}g if $re ne "";
          PERL
            # (the app's own code, beside them — the crew's and the docs' pages, in their own directories, untouched)
            find "$P" -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.json' \) -exec perl -i -p relink.pl {} +
            # (each left to main's only if every mention of it in the preview is now that code's ../ — one named
            # otherwise, in a subdirectory, or nowhere, kept)
            mentions() { (grep -rIhoF -- "$1" "${@:2}" || true) | wc -l; }
            left=0
            while read -r n; do
              all=$(mentions "$n" "$P")
              up=$(mentions "../$n" "$P"/*.js "$P"/*.css "$P"/*.html "$P"/*.json)
              if [ "$all" -gt 0 ] && [ "$all" = "$up" ]; then rm -f "$P/$n"; left=$((left + 1)); fi
            done < shared.txt
            echo "preview /$preview_path/: $left of its binaries left to main's copy ($(wc -l < shared.txt) identical)" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$kind" = test ]; then preview=yes; else ineptie=yes; fi
          done
          size_mb() { echo $(( $(du -sb _site | cut -f1) / 1000000 )); }
          size=$(size_mb)
          if [ "$size" -gt 900 ] && [ "$ineptie" = yes ]; then
            echo "::error title=Ineptie not deployed::the site with /$INEPTIE_PATH/ comes to $size MB (over the 900 MB budget)"
            exit 1
          fi
          if [ "$size" -gt 900 ] && [ "$preview" = yes ]; then
            msg="the site with /$PREVIEW_PATH/ comes to $size MB (over 900 MB of Pages' 1 GB): deployed with main alone"
            echo "::warning title=Preview not deployed::$msg"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> $msg" >> "$GITHUB_STEP_SUMMARY"
            rm -rf "_site/$PREVIEW_PATH"
            preview=no
            size=$(size_mb)
          fi
          echo "site: $size MB (test: $preview, ineptie: $ineptie)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 900 ]; then
            echo "::error title=Site size::the site comes to $size MB, over 900 MB of Pages' 1 GB limit (docs/ASSETS.md)"
            exit 1
          elif [ "$size" -gt 800 ]; then
            echo "::warning title=Site size::the site comes to $size MB, past 800 MB of Pages' 1 GB limit (docs/ASSETS.md)"
          fi
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          echo "ineptie=$ineptie" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # (the github-pages environment's branch policy must name every branch whose push deploys, or this
  # job is rejected before its first step: Settings → Environments → github-pages → deployment
  # branches — main and the preview branch; a retired branch's entry is inert)
  deploy:
    if: github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: The addresses
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
          PREVIEW: ${{ needs.site.outputs.preview }}
          INEPTIE: ${{ needs.site.outputs.ineptie }}
        run: |
          echo "main:    $URL"
          if [ -n "$PREVIEW" ]; then echo "preview: $URL$PREVIEW/"; fi
          if [ -n "$INEPTIE" ]; then echo "ineptie: $URL$INEPTIE/"; fi

  # the dedicated server (docs/DEPLOY.md): the same site artifact in an nginx image on GHCR, then the
  # `deploy` branch names that image — the server's Portainer polls the branch and pulls it; nothing
  # calls in. The branch moves only once the image is pushed, each image under its own tag.
  # main alone: the preview is GitHub Pages' (/<PREVIEW_PATH>/), left out of the image, and a preview
  # push — main unchanged — redeploys nothing (the branch named here as in `on.push`: env is not read in
  # a job's `if`)
  server:
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/test-kimi' && github.ref != 'refs/heads/Ineptie-Version'
    needs: site
    runs-on: ubuntu-latest
    # (the deploy branch is also written by rooms.yml: one writer at a time)
    concurrency:
      group: deploy-branch
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Build and push the image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ needs.site.outputs.main }}
        run: |
          set -euo pipefail
          mkdir -p _site
          tar -xf pages-artifact/artifact.tar -C _site
          rm -rf pages-artifact
          if [ -n "$PREVIEW_PATH" ]; then rm -rf "_site/$PREVIEW_PATH"; fi
          if [ -n "$INEPTIE_PATH" ]; then rm -rf "_site/$INEPTIE_PATH"; fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${MAIN:0:7}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f deploy/Dockerfile -t "$image:$tag" -t "$image:latest" .
          docker push "$image:$tag"
          docker push "$image:latest"
          echo "ref=$image:$tag" >> "$GITHUB_OUTPUT"
      - name: Point the deploy branch at it
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.image.outputs.ref }}
          MAIN: ${{ needs.site.outputs.main }}
        run: |
          set -euo pipefail
          git init -q deploy-branch
          cd deploy-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin deploy; then git checkout -q -b deploy FETCH_HEAD; else git checkout -q --orphan deploy; fi
          # (the room server's image kept as rooms.yml last set it — none yet: its block left out)
          ROOMS=$( (grep -E '^ +image: ghcr\.io/[^ ]*:rooms-' compose.yml 2>/dev/null || true) | head -1 | awk '{print $2}' | tr -d ';"')
          sh ../deploy/render-compose.sh "$REF" "$ROOMS" > compose.yml
          git add compose.yml
          git commit -q -m "deploy: $REF (main ${MAIN:0:7})"
          git push -q origin deploy
          echo "server: $REF" >> "$GITHUB_STEP_SUMMARY"
