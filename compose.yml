# The server's stack (docs/DEPLOY.md). The CI writes this file to the `deploy` branch with the images it
# has pushed in place of the two placeholders (deploy/render-compose.sh): the site's (pages.yml) and the
# room server's (rooms.yml — its block left out until it has an image); the server's Portainer polls that
# branch and redeploys on a change (only the service whose image changed is recreated).
# (Portainer 2.9 runs docker-compose v1: the version key is kept)
version: "3.8"
services:
  kerr:
    image: ghcr.io/thesamlepirate/black-hole-gpu:e544f10-592.1
    ports:
      - "3000:80"
    restart: unless-stopped
# rooms-begin
  rooms:
    image: ghcr.io/thesamlepirate/black-hole-gpu:rooms-7a590e3-38.1
    ports:
      - "3001:3001"
    volumes:
      - rooms-data:/data
    # (the TURN relay's shared secret — the stack's environment in Portainer; unset: STUN alone)
    environment:
      - TURN_SECRET=${TURN_SECRET:-}
      # (the real traffic's relay — server/traffic.ts: aisstream.io's key, OpenSky's client credentials; unset: the
      # aircraft from adsb.lol alone, no ships)
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      - OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID:-}
      - OPENSKY_CLIENT_SECRET=${OPENSKY_CLIENT_SECRET:-}
    stop_grace_period: 10s
    restart: unless-stopped
  # the TURN relay for the voices and the direct links through a carrier's NAT (docs/DEPLOY.md): TURN_SECRET in
  # the stack's environment, 3478/udp+tcp and 49160-49200/udp open on the server
  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    command: >-
      -n --listening-port=3478 --min-port=49160 --max-port=49200 --use-auth-secret
      --static-auth-secret=${TURN_SECRET} --realm=samlepirate.org --fingerprint --no-tls --no-dtls
      --no-cli --no-multicast-peers --log-file=stdout
      --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
      --user-quota=12 --total-quota=60 --max-bps=200000
    restart: unless-stopped
volumes:
  rooms-data: {}
# rooms-end
