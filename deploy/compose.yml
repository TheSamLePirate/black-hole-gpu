# The server's stack (docs/DEPLOY.md). The CI writes this file to the `deploy` branch with the images it
# has pushed in place of the two placeholders (deploy/render-compose.sh): the site's (pages.yml) and the
# room server's (rooms.yml — its block left out until it has an image); the server's Portainer polls that
# branch and redeploys on a change (only the service whose image changed is recreated).
# (Portainer 2.9 runs docker-compose v1: the version key is kept)
version: "3.8"
services:
  kerr:
    image: __KERR_IMAGE__
    ports:
      - "3000:80"
    restart: unless-stopped
# rooms-begin
  rooms:
    image: __ROOMS_IMAGE__
    ports:
      - "3001:3001"
    volumes:
      - rooms-data:/data
    stop_grace_period: 10s
    restart: unless-stopped
volumes:
  rooms-data: {}
# rooms-end
