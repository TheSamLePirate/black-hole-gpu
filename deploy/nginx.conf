# The site on the dedicated server (docs/DEPLOY.md): the Pages build served as is, the TLS and the
# domain left to the Nginx Proxy Manager in front of it.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # (what nginx's own table lacks: the KTX2 textures, the PWA's manifest — a types block here
    # replaces the inherited table, hence its include)
    include /etc/nginx/mime.types;
    types {
        image/ktx2 ktx2;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm application/manifest+json
               image/svg+xml application/octet-stream;

    # the bundler's hashed files (name-xxxxxxxx.ext): never change under their name
    location ~ "-[a-z0-9]{8}\.[a-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # the rest (the page, the Service Worker, version.json, precache.json, the workers): asked again
    # each time — a deployment reaches the clients at their next load
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
