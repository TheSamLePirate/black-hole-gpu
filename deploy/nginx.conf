# The site on the dedicated server (docs/DEPLOY.md): the Pages build served as is, the TLS and the
# domain left to the Nginx Proxy Manager in front of it.

# (the page cross-origin isolated — COOP same-origin + COEP credentialless: SharedArrayBuffer for the Linux OBC's multi-CPU —
# only for a player who asked for it: the kerr_coi cookie the OBC sets (src/obc/isolation.ts, docs/DEPLOY.md). Without it the
# game is served as before the OBC: an empty value sends no header)
map $cookie_kerr_coi $kerr_coop {
    "1"     "same-origin";
    default "";
}
map $cookie_kerr_coi $kerr_coep {
    "1"     "credentialless";
    default "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # (what nginx's own table lacks: the KTX2 textures, the PWA's manifest — a types block here
    # replaces the inherited table, hence its include)
    include /etc/nginx/mime.types;
    types {
        image/ktx2 ktx2;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm application/manifest+json
               image/svg+xml application/octet-stream;

    # (the security headers, in each location: an add_header there drops the server's own — audit QA-18, 13 Nov 2026. The
    # page's scripts are held by its own <meta> Content-Security-Policy, index.html; here what a meta cannot: who may frame it)
    # the bundler's hashed files (name-xxxxxxxx.ext): never change under their name
    location ~ "-[a-z0-9]{8}\.[a-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # the rest (the page, the Service Worker, version.json, precache.json, the workers): asked again
    # each time — a deployment reaches the clients at their next load
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        add_header Cross-Origin-Opener-Policy $kerr_coop always;
        add_header Cross-Origin-Embedder-Policy $kerr_coep always;
        # (the same page with or without isolation: a cache keeps the two apart, a revalidation after a change of the
        # cookie is not answered by the other one's 304)
        add_header Vary "Cookie" always;
        try_files $uri $uri/ =404;
    }
}
