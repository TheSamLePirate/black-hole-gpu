<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Kerr Black Hole — WebGPU GR ray tracer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/ui/panel.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="overlay"></canvas>

    <div id="loading" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="ld-sky" aria-hidden="true"><i></i><i></i></div>
      <div class="ld-main">
        <div class="ld-hole" aria-hidden="true">
          <div class="ld-glow"></div>
          <div class="ld-halo"><i></i></div>
          <div class="ld-disk"><i></i></div>
          <div class="ld-shadow"></div>
          <div class="ld-disk front"><i></i></div>
        </div>
        <h1 class="ld-title">KERR</h1>
        <p class="ld-sub">General-relativistic ray tracing · the journey to Gargantua</p>
        <div class="ld-progress">
          <div class="ld-bar"><i></i></div>
          <div class="ld-line"><span class="ld-stage">Starting the ray tracer…</span><span class="ld-pct">0 %</span></div>
        </div>
        <ol class="ld-steps"></ol>
        <button class="ld-skip" hidden>Enter now — the rest keeps loading</button>
      </div>
      <p class="ld-tip"></p>
    </div>

    <div id="hud" class="glass">
      <button id="hud-toggle" aria-expanded="false" aria-controls="hud-more" data-tip="Details and physical readouts" data-key="I">
        <span id="status"></span>
        <svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" /></svg>
      </button>
      <div id="hud-progress"><i></i></div>
      <div id="hud-more">
        <div id="stats"></div>
        <div id="spin-badge" class="badge"></div>
        <div id="readouts"></div>
      </div>
    </div>

    <div id="panel"></div>

    <nav id="toolbar" class="glass">
      <button id="btn-scenes" data-tip="Scenes — every black hole, the wormhole, Gargantua and the game's missions"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.6" /><rect x="3.5" y="13.5" width="7" height="7" rx="1.6" /><circle cx="17" cy="17" r="3.2" class="fill" /></svg><span>Scenes</span></button>
      <span class="sep"></span>
      <button id="btn-camera" data-tip="Camera — placement, look at the target, lens & telescope, target, cinematics" data-key="V"><svg viewBox="0 0 24 24"><path d="M3 8.5a2 2 0 0 1 2-2h2.2l1.6-2h6.4l1.6 2H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><circle cx="12" cy="12.5" r="3.6" /></svg><span class="cam-mode">Around</span><span class="cam-target">Gargantua</span></button>
      <span class="sep"></span>
      <button id="btn-jet" data-tip="Relativistic jet" data-key="J"><svg viewBox="0 0 24 24"><path d="M12 2v20" /><path d="M9 5l3-3 3 3M9 19l3 3 3-3" /><ellipse cx="12" cy="12" rx="6" ry="2" /></svg><span>Jet</span></button>
      <button id="btn-ship" data-tip="Ranger — fly the spaceship (⇧K: camera attach point)" data-key="K"><svg viewBox="0 0 24 24"><path d="M12 3l3.2 7.5 6.3 3.5-6.8 1.6L12 21l-2.7-5.4L2.5 14l6.3-3.5z" /><path d="M9.8 10.8h4.4" /></svg><span>Ranger</span></button>
      <button id="btn-cinema" data-tip="Cinematic mode — a liquid surface across the wormhole's throat" data-key="L"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M5 11.5c1.2-1.2 2.3-1.2 3.5 0s2.3 1.2 3.5 0 2.3-1.2 3.5 0 2.3 1.2 3.5 0" /><path d="M6.5 15.5c1-1 1.9-1 2.9 0s1.9 1 2.9 0 1.9-1 2.9 0" /></svg><span>Cinema</span></button>
      <button id="btn-guide" data-tip="Shadow guide (analytic)" data-key="G"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 14 0 7 7 0 1 0-14 0" stroke-dasharray="3 2" /></svg><span>Guide</span></button>
      <span class="sep"></span>
      <button id="btn-sky" data-tip="Sky chart — constellations, star names, equatorial &amp; horizontal grids (U: grids)" data-key="N"><svg viewBox="0 0 24 24"><circle cx="5" cy="17" r="1.5" class="fill" /><circle cx="10" cy="8" r="1.5" class="fill" /><circle cx="17" cy="11" r="1.5" class="fill" /><circle cx="19.5" cy="4.5" r="1.1" class="fill" /><path d="M5 17l5-9 7 3 2.5-6.5" /></svg><span>Sky</span></button>
      <button id="btn-tools" data-tip="Game tools: status, place, target, time, saves, audit, journal" data-key="F2"><svg viewBox="0 0 24 24"><path d="M14.5 5.5a4 4 0 0 0-5 5L4 16l4 4 5.5-5.5a4 4 0 0 0 5-5l-2.6 2.6-2.8-.6-.6-2.8z" /></svg><span>Tools</span></button>
      <button id="btn-sound" data-tip="Sound on / off (Settings › Game › Sound: the mix)"><svg viewBox="0 0 24 24" class="ic-on"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" class="fill" /><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /></svg><svg viewBox="0 0 24 24" class="ic-off"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" class="fill" /><path d="M16 9.5l5 5M21 9.5l-5 5" /></svg><span>Sound</span></button>
      <button id="btn-render" data-tip="Offline render & video"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2" /><path d="M8 21h8M12 17v4" /><path d="M10 8.5v5l4-2.5z" class="fill" /></svg><span>Render</span></button>
      <button id="btn-shot" data-tip="Save PNG" data-key="P"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2" /><circle cx="12" cy="13" r="3.5" /><path d="M8 6l1.5-2h5L16 6" /></svg><span>PNG</span></button>
      <button id="btn-full" data-tip="Fullscreen" data-key="F"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg><span>Full</span></button>
      <button id="btn-hide" data-tip="Hide interface" data-key="H"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" /><circle cx="12" cy="12" r="2.8" /><path d="M4 20L20 4" /></svg><span>Hide</span></button>
      <button id="btn-help" data-tip="Keyboard & mouse" data-key="?"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2 1-1.2 1.9v.4" /><circle cx="12" cy="17.2" r="0.9" class="fill" /></svg><span>Help</span></button>
    </nav>

    <section id="render" class="glass" hidden>
      <header>
        <div>
          <h2>Offline render</h2>
          <p>Scene frozen in time · any resolution · rendered progressively over many frames</p>
        </div>
        <button id="render-close" class="icon" title="Hide (the render keeps running)">✕</button>
      </header>
      <div class="form">
        <label title="Sets resolution, sampling and integrator for the purpose">Preset<select id="r-preset"></select></label>
        <label>Resolution<select id="r-res"></select></label>
        <div class="pair">
          <label>Width<input id="r-w" type="number" min="16" step="1" /></label>
          <label>Height<input id="r-h" type="number" min="16" step="1" /></label>
        </div>
        <label>Samples / pixel<select id="r-spp"></select></label>
        <label>Geodesic integrator<select id="r-int"></select></label>
        <label title="Stop sampling a pixel once the relative standard error of its mean falls below this value">Adaptive sampling (noise threshold)<select id="r-noise"></select></label>
        <label title="Exposure time in units of M = GM/c³; samples are spread over it (motion blur of the flow)">Motion-blur shutter [M]<input id="r-shutter" type="number" min="0" step="0.5" value="0" /></label>
        <label>GPU budget<select id="r-budget"></select></label>
      </div>
      <div class="progress"><div id="r-bar"></div></div>
      <div id="r-status"></div>
      <div class="actions">
        <button id="r-start" class="primary">Start render</button>
        <button id="r-pause">Pause</button>
        <button id="r-stop">Close</button>
      </div>
      <details id="r-video">
        <summary>Video</summary>
        <div class="form">
          <label title="What the video films: the scene as it goes on from now (the camera's mode, the ship and its autopilot, the mission — as live), a take recorded live (● on the time bar), or a cinematic">Shot<select id="v-source"></select></label>
          <div class="pair">
            <label>Duration [s]<input id="v-duration" type="number" min="1" max="600" step="1" value="24" /></label>
            <label>Frame rate<select id="v-fps"></select></label>
          </div>
          <div class="pair">
            <label title="The scene's time during the video: the live warp, another one, or frozen (the camera moves in a still instant)">Time<select id="v-rate"></select></label>
            <label title="Motion blur of the flow: exposure as a fraction of the frame interval">Shutter<select id="v-shutter"></select></label>
          </div>
          <label class="check" title="After the video, the scene returns to where it was (else it goes on from the video's end)"><input id="v-restore" type="checkbox" checked /> Return to the start afterwards</label>
          <div id="v-note" class="note"></div>
        </div>
        <div class="actions">
          <button id="v-start" class="primary">Render video (MP4)</button>
          <button id="v-stop">Stop</button>
        </div>
      </details>
      <div class="actions exports">
        <span>Export</span>
        <button id="r-png" title="8-bit sRGB, tone-mapped">PNG</button>
        <button id="r-png16" title="16 bits per channel sRGB, tone-mapped, no dithering">PNG 16-bit</button>
        <button id="r-exr" title="Linear scene radiance (half float), no bloom / tone mapping">EXR (HDR)</button>
      </div>
    </section>

    <div id="tip" role="tooltip" hidden></div>
    <div id="hint" hidden>
      <span><b>Drag</b> to orbit</span><span><b>Wheel</b> to zoom</span><span><b>Click</b> a body to target it</span><span><kbd>?</kbd> all shortcuts</span>
    </div>

    <div id="error" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
