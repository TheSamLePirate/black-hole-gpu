<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Kerr Black Hole — WebGPU GR ray tracer</title>
    <script>
      // (the main thread watched from the first byte — src/boot-timeline.ts reads it: the long tasks, and the
      // gaps between animation frames until the boot is over)
      (function () {
        var w = (window.__boot = { long: [], gaps: [] });
        try {
          new PerformanceObserver(function (l) {
            l.getEntries().forEach(function (e) {
              w.long.push([Math.round(e.startTime), Math.round(e.duration)]);
            });
          }).observe({ type: "longtask" });
        } catch (e) {}
        var last = 0;
        function frame(t) {
          if (last && t - last > 50 && !document.hidden) w.gaps.push([Math.round(last), Math.round(t - last)]);
          last = t;
          if (!w.stop) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
    <script>
      // (the intro's language and its length, before the first paint: the language kept or the browser's, the
      // full intro on a first visit — and the first after an update (src/intro/intro.ts clears the mark) —,
      // a short one after; the keys under this build's prefix too (a preview under test/))
      (function () {
        var d = document.documentElement;
        function get(k) {
          try {
            var segs = location.pathname.split("/").filter(Boolean);
            for (var i = 0; i < segs.length; i++) {
              var v = localStorage.getItem(segs[i] + "/" + k);
              if (v !== null) return v;
            }
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        }
        var l = get("kerr.lang");
        d.lang = l === "fr" || l === "en" ? l : (navigator.language || "en").toLowerCase().indexOf("fr") === 0 ? "fr" : "en";
        if (get("kerr.intro.seen")) d.classList.add("intro-short");
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("intro-still");
      })();
    </script>
    <link rel="stylesheet" href="./src/intro/intro.css" />
    <link rel="stylesheet" href="./src/fonts.css" />
    <link rel="stylesheet" href="./src/ui/kit/kit.css" />
    <link rel="stylesheet" href="./src/ui/menus.css" />
    <link rel="stylesheet" href="./src/ui/menu/menu.css" />
    <link rel="stylesheet" href="./src/ui/title/title.css" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/ui/panel.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="overlay"></canvas>

    <!-- the intro (PLAN-TITRE-AAA E1, src/intro/): black, the studio, the name, the logo — CSS only, on the
         compositor, running before the game's script is even here; the background and the loading orb drawn by
         a Worker (src/intro/worker.ts); lifted onto the live scene once its first image and its sky are in -->
    <div id="loading" class="intro" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <canvas class="in-bg" aria-hidden="true"></canvas>
      <div class="in-studio" aria-hidden="true">
        <i class="in-bloom"></i>
        <i class="in-flare"></i>
        <b class="in-studio-name"><i style="--k:-5">S</i><i style="--k:-4">A</i><i style="--k:-3">M</i><i style="--k:-2">L</i><i style="--k:-1">E</i><i style="--k:0">P</i><i style="--k:1">I</i><i style="--k:2">R</i><i style="--k:3">A</i><i style="--k:4">T</i><i style="--k:5">E</i></b>
        <span class="in-studio-sub"><span lang="fr">présente</span><span lang="en">presents</span></span>
      </div>
      <div class="in-hero">
        <!-- the mark: the game's own black hole, rendered by its ray tracer (scripts/logo-render.ts, scripts/build-logo.py) -->
        <div class="in-mark" aria-hidden="true">
          <img class="in-mark-glow" src="./assets/title/kerr-mark.webp" alt="" />
          <img class="in-mark-img" src="./assets/title/kerr-mark.webp" alt="" />
        </div>
        <h1 class="in-name" aria-label="KERR"><i>K</i><i>E</i><i>R</i><i>R</i></h1>
        <p class="in-tag"><span lang="fr">Un vol à travers l'espace-temps de Kerr — jusqu'à Gargantua</span><span lang="en">A flight through Kerr spacetime — on to Gargantua</span></p>
      </div>
      <div class="in-load">
        <ol class="in-steps" hidden></ol>
        <button class="in-orb-btn" type="button" aria-expanded="false" title="">
          <canvas class="in-orb" aria-hidden="true"></canvas>
          <span class="in-load-text"><span class="ld-stage"></span><span class="ld-pct">0 %</span></span>
        </button>
        <p class="in-note" hidden></p>
        <button class="in-enter" type="button" hidden></button>
      </div>
      <p class="in-skip" aria-hidden="true"><span lang="fr">Une touche pour passer</span><span lang="en">Any key to skip</span></p>
      <p class="in-credit">© SamLePirate</p>
    </div>

    <div id="hud" class="glass">
      <button id="hud-toggle" aria-expanded="false" aria-controls="hud-more" data-tip="Details and physical readouts" data-key="I">
        <span id="status"></span>
        <svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" /></svg>
      </button>
      <div id="hud-progress"><i></i></div>
      <div id="hud-more">
        <div id="stats"></div>
        <div id="spin-badge" class="badge"></div>
        <div id="readouts"></div>
      </div>
    </div>

    <div id="panel"></div>

    <!-- the app's buttons: moved into the top bar at start, their ids kept (src/ui/topbar.ts) -->
    <nav id="toolbar" class="glass">
      <button id="btn-scenes" data-tip="Scenes — every black hole, the wormhole, Gargantua and the game's missions"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.6" /><rect x="3.5" y="13.5" width="7" height="7" rx="1.6" /><circle cx="17" cy="17" r="3.2" class="fill" /></svg><span>Scenes</span></button>
      <span class="sep"></span>
      <button id="btn-camera" data-tip="Camera — placement, look at the target, lens & telescope, target, cinematics" data-key="V"><svg viewBox="0 0 24 24"><path d="M3 8.5a2 2 0 0 1 2-2h2.2l1.6-2h6.4l1.6 2H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><circle cx="12" cy="12.5" r="3.6" /></svg><span class="cam-mode">Around</span><span class="cam-target">Gargantua</span></button>
      <span class="sep"></span>
      <button id="btn-music" data-tip="Music — the themes, listen, the mode, the mixer, which theme when"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12" /><circle cx="6.5" cy="18" r="2.5" class="fill" /><circle cx="17.5" cy="16" r="2.5" class="fill" /></svg><span>Music</span></button>
      <button id="btn-sky" data-tip="Sky chart — constellations, star names, equatorial &amp; horizontal grids (U: grids)" data-key="N"><svg viewBox="0 0 24 24"><circle cx="5" cy="17" r="1.5" class="fill" /><circle cx="10" cy="8" r="1.5" class="fill" /><circle cx="17" cy="11" r="1.5" class="fill" /><circle cx="19.5" cy="4.5" r="1.1" class="fill" /><path d="M5 17l5-9 7 3 2.5-6.5" /></svg><span>Sky</span></button>
      <button id="btn-help" data-tip="Keyboard & mouse" data-key="?"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2 1-1.2 1.9v.4" /><circle cx="12" cy="17.2" r="0.9" class="fill" /></svg><span>Help</span></button>
    </nav>

    <div id="tip" role="tooltip" hidden></div>
    <div id="hint" hidden>
      <span><b>Drag</b> to orbit</span><span><b>Wheel</b> to zoom</span><span><b>Click</b> a body to target it</span><span><kbd>?</kbd> all shortcuts</span>
    </div>

    <div id="error" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
