<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Kerr: the black hole's shadow, its photon ring, the accretion disc seen nearly edge-on (its far
       side bent over and under the shadow), on the night sky — the app's palette (#07080c, amber #ffb347). -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#121623"/>
      <stop offset="1" stop-color="#07080c"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.15"/>
      <stop offset="0.35" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#fff2cf"/>
      <stop offset="0.65" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a2a" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="0.80" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.90" stop-color="#ffe6b0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="top"><rect x="0" y="0" width="512" height="256"/></clipPath>
    <clipPath id="bottom"><rect x="0" y="256" width="512" height="256"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#cfd8ff">
    <circle cx="62" cy="88" r="1.6"/><circle cx="430" cy="70" r="1.2"/><circle cx="470" cy="420" r="1.8"/>
    <circle cx="90" cy="440" r="1.3"/><circle cx="380" cy="470" r="1.1"/><circle cx="150" cy="40" r="1.1"/>
    <circle cx="40" cy="300" r="1.0"/><circle cx="480" cy="250" r="1.2"/><circle cx="300" cy="30" r="1.4"/>
  </g>
  <!-- the far side of the disc, lensed over the shadow -->
  <ellipse cx="256" cy="256" rx="140" ry="112" fill="none" stroke="url(#disc)" stroke-width="26" clip-path="url(#top)" opacity="0.95"/>
  <!-- the near side of the disc -->
  <ellipse cx="256" cy="256" rx="214" ry="40" fill="none" stroke="url(#disc)" stroke-width="30"/>
  <!-- the lensed far side under the shadow -->
  <ellipse cx="256" cy="256" rx="140" ry="112" fill="none" stroke="url(#disc)" stroke-width="16" clip-path="url(#bottom)" opacity="0.8"/>
  <!-- the shadow and its photon ring -->
  <circle cx="256" cy="256" r="96" fill="#040508"/>
  <circle cx="256" cy="256" r="106" fill="url(#ring)"/>
</svg>
